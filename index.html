<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<style>
  :root{--ivory:#F4EFE3; --card:#FBF8F0; --ink:#24271D; --gold:#B98D4E; --gold-line: rgba(185,141,78,.35);}
  body{margin:0; background:var(--ivory); color:var(--ink); font-family:system-ui,sans-serif;}
  img{max-width:100%; display:block; background:#eee;}
  .section{padding:4rem 1.5rem;}
  .card{background:var(--card); border:1px solid var(--gold-line); border-radius:20px; padding:2rem;}
  #cover{position:fixed; inset:0; z-index:999; background:var(--ivory); display:flex; align-items:center; justify-content:center; transition:opacity .5s;}
  #cover.closed{opacity:0; pointer-events:none;}
  .gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
</style>
</head>
<body>

<div id="cover"><button onclick="openInvitation()">Buka Undangan</button></div>

<main>
  <section class="section"><img id="hero-photo" src="" alt="Hero"></section>
  <section class="section" id="events-list"></section>
  <section class="section"><div class="gallery-grid" id="gallery-grid"></div></section>
</main>

<script>
// EDIT DATA DI SINI
var DATA = {
  fotoHero: "hero.jpg",
  acara: [
    { nama: "Akad", tanggal: "14 Nov 2026", tempat: "Cirebon" }
  ],
  galeri: ["g1.jpg", "g2.jpg", "g3.jpg"],
  nomorWhatsapp: "6282121759018"
};

// LOGIKA REVISI
function openInvitation(){
  document.getElementById('cover').classList.add('closed');
}

function init() {
  document.getElementById('hero-photo').src = DATA.fotoHero;
  document.getElementById('hero-photo').loading = "lazy";

  document.getElementById('events-list').innerHTML = DATA.acara.map(e => `
    <div class="card">
      <h3>${e.nama}</h3>
      <p>${e.tanggal}</p>
      <p>${e.tempat}</p>
    </div>
  `).join('');

  document.getElementById('gallery-grid').innerHTML = DATA.galeri.map(src => `
    <img src="${src}" loading="lazy" alt="Gallery">
  `).join('');
}

init();
</script>
</body>
</html>
